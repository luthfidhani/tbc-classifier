[project]
name = "tbc-classifier"
version = "0.1.0"
description = "TB vs non-TB chest X-ray classifier with Grad-CAM and external-hospital validation"
requires-python = ">=3.11"
dependencies = [
    "grad-cam>=1.5.7",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "torchxrayvision>=1.5.7",
]
